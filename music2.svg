    <stop offset="33%" stop-color="#ffee00"></stop>
    <stop offset="50%" stop-color="#00ff6a"></stop>
    <stop offset="66%" stop-color="#00d9ff"></stop>
    <stop offset="83%" stop-color="#6a00ff"></stop>
